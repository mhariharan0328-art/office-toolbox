
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF | Office Toolbox</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #ffffff;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        header a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 850px;
            margin: 35px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 5px 22px #1720330c;
        }

        h1 { margin-top: 0; }

        .muted { color: #64748b; line-height: 1.6; }

        .upload {
            display: block;
            padding: 28px;
            margin: 24px 0;
            border: 2px dashed #93a9cc;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            background: #f8fbff;
        }

        .upload input { margin-top: 16px; max-width: 100%; }

        .file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .file-info { flex: 1; min-width: 0; }
        .file-info strong { overflow-wrap: anywhere; }
        .file-info small { display: block; color: #64748b; margin-top: 5px; }

        button {
            padding: 10px 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .move, .remove { background: #e8eef8; color: #172033; }
        .remove { color: #b91c1c; }

        .primary {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            margin-top: 18px;
        }

        .preview {
            width: 100%;
            height: 420px;
            margin-top: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        #status { margin-top: 16px; white-space: pre-wrap; }
        .error { color: #b91c1c; }
        .success { color: #15803d; }

        @media (max-width: 520px) {
            main { padding: 12px; margin: 18px auto; }
            .panel { padding: 18px; }
            .file { flex-wrap: wrap; }
            .preview { height: 320px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="./index.html">← Office Toolbox</a>
        <span style="float:right;font-size:14px;"><a href="./how-to-merge-pdf-files.html">PDF merging guide</a></span>
    </header>

    <main>
        <section class="panel">
            <h1>Merge PDF Files</h1>
            <p class="muted">
                Select at least two PDFs, arrange their order,
                preview individual files, and download one merged PDF.
            </p>

            <label class="upload">
                <strong>Select PDF files</strong>
                <p class="muted">PDF only · Up to 20 files · 100 MB total</p>
                <input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple>
            </label>

            <p id="fileSummary" class="muted">No PDFs selected.</p>
            <div id="fileList"></div>

            <button id="mergeBtn" class="primary" disabled>
                Merge and Download PDF
            </button>

            <p id="status" role="status" aria-live="polite"></p>

            <h2>PDF Preview</h2>
            <p class="muted">Choose Preview on a file to view it here.</p>
            <iframe id="preview" class="preview" title="PDF preview" hidden></iframe>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="./merge-pdf.js"></script>
</body>
</html>
